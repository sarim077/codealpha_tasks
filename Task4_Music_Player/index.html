<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraWave Music Player</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="ambient-glow glow-primary"></div>
  <div class="ambient-glow glow-secondary"></div>

  <!-- Audio Element -->
  <audio id="audioElement" preload="metadata"></audio>

  <main class="player-app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-logo">
        <i class="fa-solid fa-compact-disc spin-icon"></i>
        <span>AuraWave Player</span>
      </div>
      <div class="header-status">
        <span class="live-pill">CodeAlpha Task 4</span>
      </div>
    </header>

    <div class="player-card">
      <!-- Disc / Cover Art Showcase -->
      <div class="cover-wrapper">
        <div class="disc-record" id="discRecord">
          <img src="" alt="Album Artwork" id="albumArt" class="album-art">
          <div class="disc-center"></div>
        </div>
      </div>

      <!-- Track Information -->
      <div class="track-details">
        <h2 class="track-title" id="trackTitle">Loading Song...</h2>
        <p class="track-artist" id="trackArtist">Artist Name</p>
        <span class="track-genre" id="trackGenre">Genre</span>
      </div>

      <!-- Animated Sound Wave Visualizer Bars -->
      <div class="visualizer" id="visualizer">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>

      <!-- Progress Bar & Durations -->
      <div class="progress-section">
        <div class="progress-bar-container" id="progressContainer">
          <div class="progress-bar-bg"></div>
          <div class="progress-bar-fill" id="progressFill"></div>
          <div class="progress-scrubber" id="progressScrubber"></div>
        </div>
        <div class="timestamps">
          <span id="currentTime">0:00</span>
          <span id="durationTime">0:00</span>
        </div>
      </div>

      <!-- Main Playback Controls -->
      <div class="controls-section">
        <button class="control-btn sub-btn" id="shuffleBtn" title="Shuffle Mode">
          <i class="fa-solid fa-shuffle"></i>
        </button>
        <button class="control-btn" id="prevBtn" title="Previous Song">
          <i class="fa-solid fa-backward-step"></i>
        </button>
        <button class="control-btn play-pause-btn" id="playPauseBtn" title="Play / Pause">
          <i class="fa-solid fa-play" id="playIcon"></i>
        </button>
        <button class="control-btn" id="nextBtn" title="Next Song">
          <i class="fa-solid fa-forward-step"></i>
        </button>
        <button class="control-btn sub-btn" id="repeatBtn" title="Repeat Mode">
          <i class="fa-solid fa-repeat"></i>
        </button>
      </div>

      <!-- Volume & Utility Controls -->
      <div class="utilities-section">
        <div class="volume-box">
          <button class="vol-icon-btn" id="muteBtn" title="Mute/Unmute">
            <i class="fa-solid fa-volume-high" id="volumeIcon"></i>
          </button>
          <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
          <span class="volume-pct" id="volumePct">80%</span>
        </div>
        <button class="playlist-toggle-btn" id="playlistToggleBtn" title="Toggle Playlist View">
          <i class="fa-solid fa-list-ul"></i>
        </button>
      </div>
    </div>

    <!-- Playlist Drawer / Section -->
    <div class="playlist-modal" id="playlistModal">
      <div class="playlist-header">
        <h3><i class="fa-solid fa-music"></i> Playlist Queue</h3>
        <span class="badge-count" id="playlistCount">4 Songs</span>
      </div>
      <div class="playlist-scroll" id="playlistItems">
        <!-- Generated by JS -->
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
